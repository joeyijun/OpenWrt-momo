name: check-packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'momo/**'
      - 'luci-app-momo/**'
      - 'tests/**'
      - '.github/workflows/check-packages.yml'

permissions:
  contents: read

concurrency:
  group: check-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    name: Shell tests / ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: [openwrt-24.10, openwrt-25.12]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fetch the test core
        run: |
          archive=sing-box-1.14.4-linux-amd64-musl.tar.gz
          curl -fSL --retry 2 --max-time 120 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/$archive"
          printf '%s  %s\n' 8f7c5f0651238850d96a0e488e5473cd77ec1a0098f63942e943f475a12057ca \
            "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"

      - name: Run the isolated OpenWrt tests
        env:
          OPENWRT_BRANCH: ${{ matrix.branch }}
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/sing-box-1.14.4-linux-amd64-musl/sing-box:/usr/bin/sing-box:ro" \
            -w /src "ghcr.io/openwrt/rootfs:x86_64-${OPENWRT_BRANCH}" /bin/sh -ec '
              sing-box version
              ash -n momo/files/momo.init
              ash tests/tun-wait.sh
              ash tests/service-change.sh
              ash tests/subscription-lock.sh
            '

  build:
    name: aarch64_cortex-a53 / ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: openwrt-24.10
            extension: ipk
          - branch: openwrt-25.12
            extension: apk

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: aarch64_cortex-a53-${{ matrix.branch }}
          FEEDNAME: momo
          PACKAGES: luci-app-momo
          NO_REFRESH_CHECK: true

      - name: Verify package outputs
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          for package in momo luci-app-momo; do
            if ! find bin/packages/aarch64_cortex-a53/momo -maxdepth 1 -type f -name "${package}[_-]*.${EXTENSION}" -print -quit | grep -q .; then
              echo "Expected ${package}.${EXTENSION} package was not built" >&2
              exit 1
            fi
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: momo-aarch64_cortex-a53-${{ matrix.branch }}
          path: bin/packages/aarch64_cortex-a53/momo/*.${{ matrix.extension }}
          if-no-files-found: error
